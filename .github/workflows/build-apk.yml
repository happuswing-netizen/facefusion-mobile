name: Build FaceFusion APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Change Permissions to Executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleRelease

      - name: Upload Compiled File
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-decensored-apk
          path: "**/build/outputs/apk/release/*.apk"
          
