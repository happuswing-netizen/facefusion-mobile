name: Build FaceFusion APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find and Configure Android Project Folder
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: Could not find gradlew in any project directory!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "Android project located at: $PROJECT_DIR"
          chmod +x "$GRADLE_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "GRADLE_PATH=$GRADLE_PATH" >> $GITHUB_ENV

      - name: Build with Gradle (Skip Qualcomm QNN)
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleRelease -PdisableQnn=true --stacktrace

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-decensored-apk
          path: "**/build/outputs/apk/release/*.apk"
          
